<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Within Your Way — Something is Coming</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #F7F3EE;
      --warm-white: #FDFAF7;
      --sage: #8A9E8C;
      --sage-light: #C4D0C5;
      --earth: #9B7B5E;
      --earth-dark: #6B5240;
      --bark: #2C2420;
      --mist: #E8E2DA;
      --ink: #1E1A16;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background-color: var(--warm-white);
      color: var(--ink);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      line-height: 1.7;
      overflow: hidden;
      display: grid;
      place-items: center;
      min-height: 100svh;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1000;
      opacity: 0.4;
    }
    .bg-circle { position: fixed; border-radius: 50%; pointer-events: none; }
    .bg-circle--1 {
      width: 60vw; height: 60vw; top: -15vw; right: -20vw;
      background: radial-gradient(circle, var(--sage-light) 0%, transparent 70%);
      opacity: 0.35;
    }
    .bg-circle--2 {
      width: 40vw; height: 40vw; bottom: -10vw; left: -5vw;
      background: radial-gradient(circle, #D4C4B0 0%, transparent 70%);
      opacity: 0.35;
    }
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; justify-content: center; align-items: center;
      padding: 1.5rem 3rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background: rgba(247, 243, 238, 0.7);
    }
    .nav-logo {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300; font-size: 1.1rem;
      letter-spacing: 0.12em; color: var(--ink);
      text-decoration: none; text-transform: uppercase;
    }
    .inner {
      max-width: 620px; text-align: center;
      padding: 2rem; position: relative; z-index: 1;
    }
    .eyebrow {
      font-size: 0.7rem; letter-spacing: 0.25em;
      text-transform: uppercase; color: var(--earth);
      margin-bottom: 2rem;
      animation: fadeUp 1.2s ease 0.1s both;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(2.4rem, 5vw, 4rem);
      line-height: 1.15; color: var(--ink);
      margin-bottom: 2rem;
      animation: fadeUp 1.2s ease 0.2s both;
    }
    h1 em { font-style: italic; color: var(--earth-dark); }
    .rule {
      width: 40px; height: 1px;
      background: var(--earth);
      margin: 0 auto 2rem;
      animation: fadeUp 1.2s ease 0.3s both;
    }
    .sign-off {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-size: 1.1rem;
      color: var(--earth-dark);
      animation: fadeUp 1.2s ease 0.5s both;
    }
    footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--bark); color: #7A6E66;
      text-align: center; padding: 1.2rem;
      font-size: 0.78rem; letter-spacing: 0.05em; z-index: 100;
    }
    footer span { color: var(--earth); }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 768px) { nav { padding: 1.2rem 1.5rem; } }
  </style>
</head>
<body>
  <div class="bg-circle bg-circle--1"></div>
  <div class="bg-circle bg-circle--2"></div>
  <nav><a href="#" class="nav-logo">Within Your Way</a></nav>
  <div class="inner">
    <p class="eyebrow">Something is taking shape</p>
    <h1>We're working on <em>something</em> for you</h1>
    <div class="rule"></div>
    <p class="sign-off">See you soon.</p>
  </div>
  <footer>
    <p>© 2026 <span>Within Your Way</span></p>
  </footer>
</body>
</html>
